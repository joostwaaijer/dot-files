prompt = "Volg vanuit deze coördinatiechat de afgesproken back-endherbouw van Salta. De gebruiker heeft expliciet toestemming gegeven om de uitvoeringschat instructies te sturen en na een bevestigde merge automatisch de volgende afgesproken taak op te pakken.\n\nDe huidige uitvoeringschat is 01a18151-bb5e-7af0-a792-a6e0faa9b96a op host local, getiteld 'Salta: vier storefronts, talen en URL’s'. De repositories zijn /Users/joostwaaijer/Documents/workspace/salta en /Users/joostwaaijer/Documents/workspace/salta-inertia; de roadmap staat in salta-inertia/docs/migration-matrix.md. Lees steeds de actuele gebruikersinstructies en projectregels. De frontend blijft een minimale, ongestylede shell totdat de gebruiker styling vraagt of de volledige back-endroadmap voltooid is.\n\nBegin iedere controle met een compacte wait_threads-snapshot van de relevante uitvoeringschat. Lees alleen bij nieuwe resultaten of ontbrekende context de recente gebruikers- en eindberichten; beperk tooloutputs. Stap 1 is op 28 oktober 2026 live gecontroleerd als gemerged: robuust/salta#5123 naar release/salta-inertia en robuust/salta-inertia#22 naar develop. De vervolgopdracht SALTA-BACKEND-02 voor product- en variantselectie is al verstuurd; stuur die niet opnieuw.\n\nVolg de voortgang van de actieve taak en bepaal welke PR’s daadwerkelijk bij die afgebakende stap horen. Controleer hun merge-status via GitHub zelf; een gereedmelding, gesloten PR, groene CI of lokale branch is geen bewijs van een merge. Start pas een volgende taak nadat alle benodigde PR’s van de huidige stap zijn gemerged en eventuele onafgeronde afhankelijkheden expliciet zijn beoordeeld. Een merge bewijst geen productie-uitrol. Bij een actieve chat, ongewijzigde status, ontbrekende PR, lopende review of bestaande gebruikersvraag is er niets opnieuw te starten. Meld alleen een betekenisvolle overgang, afgeronde stap, echte mislukking of benodigde keuze; herhaal ongewijzigde meldingen niet.\n\nVervolg de eerder afgesproken volgorde in kleine stappen: na product- en variantselectie komen de volledige trampolinefilters, daarna de overige catalogusonderdelen en producttypen, ontbrekende contentqueries en gedeelde content, en de berekende zoek-/keuzehulp-/montagecontracten volgens de actuele matrix. Laat eerder afgeronde onderdelen niet opnieuw bouwen. Privéoperaties, accounts, formulieren en Commerce vereisen eerst de nog open keuze GraphQL-only versus native Craft/Commerce JSON-actions; leg die keuze aan de gebruiker voor zodra die de volgende stap blokkeert. Portal/AR en cutover blijven afzonderlijke latere scopes.\n\nNa een bevestigde merge stuur je precies één concrete vervolgopdracht aan de bestaande uitvoeringschat, met de afgeronde PR’s, volgende afgebakende matrixscope, het observeerbare resultaat en actuele besluiten. Controleer eerst recente berichten en deze coördinatiegeschiedenis om dubbele opdrachten te voorkomen. Gebruik geen nieuwe chat tenzij de gebruiker die expliciet vraagt. Vraag de uitvoering om eerst de actuele code en werkstatus te controleren, een beknopte afbakening te geven en het geautoriseerde lokale werk uit te voeren. Tests, commits, push, PR-publicatie en merge behouden hun afzonderlijke gebruikersautorisatie; dit monitorverzoek verleent daarvoor geen algemene nieuwe toestemming. Hergebruik geen testautorisatie uit een eerdere afgeronde taak.\n\nWijzig als coördinator geen applicatiecode of lokale Git-state en stoor geen lopende uitvoering. Gebruik geen custom watchers of nieuwe infrastructuur. Houd opdrachten en voortgang in de chats bij, zonder persoonlijke geheugenbestanden te wijzigen. Stop de opvolging als de gebruiker dat vraagt of de afgesproken roadmap klaar is."
